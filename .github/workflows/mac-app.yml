name: Build macOS apps (AirPods Check, Gesture Collector)

on:
  push:
    branches: [mac-app]
    paths: ["ours/mac_app/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 bash ours/mac_app/build.sh
      - name: Check the app
        run: |
          lipo -info ours/mac_app/AirPodsCheck.app/Contents/MacOS/AirPodsCheck
          plutil -lint ours/mac_app/AirPodsCheck.app/Contents/Info.plist
          codesign --verify --verbose ours/mac_app/AirPodsCheck.app
      - name: Zip
        run: |
          cd ours/mac_app
          ditto -c -k --keepParent AirPodsCheck.app AirPodsCheck.zip
      - name: Publish as release "mac-app"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-app --yes --cleanup-tag || true
          gh release create mac-app ours/mac_app/AirPodsCheck.zip --target "$GITHUB_SHA" \
            --title "AirPods Check (macOS app)" \
            --notes "Unzip, then right-click AirPodsCheck.app > Open (first time only). Needs macOS 14+ and AirPods Pro/3/4/Max. Built from $GITHUB_SHA."

  gesture-collector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live recogniser matches Python (parity test on real P01 events)
        run: |
          cd ours/mac_app/GestureCollector
          swiftc -O Sources/LiveRecognizer.swift Tests/main.swift -o /tmp/parity
          /tmp/parity Tests/parity.json
      - name: Forest mode matches Python (receiver-96 features + exported random forest)
        run: |
          cd ours/mac_app/GestureCollector
          swiftc -O Sources/ForestModel.swift Tests/forest_main.swift -o /tmp/forest_parity
          /tmp/forest_parity forest_model.json Tests/forest_parity.json
      - name: Build universal Gesture Collector app
        run: UNIVERSAL=1 bash ours/mac_app/GestureCollector/build.sh
      - name: Check the app
        run: |
          lipo -info ours/mac_app/GestureCollector/GestureCollector.app/Contents/MacOS/GestureCollector
          plutil -lint ours/mac_app/GestureCollector/GestureCollector.app/Contents/Info.plist
          codesign --verify --verbose ours/mac_app/GestureCollector/GestureCollector.app
      - name: Build iPhone app (unsigned .ipa)
        run: |
          bash ours/mac_app/GestureCollector/build_ios.sh
          unzip -l ours/mac_app/GestureCollector/GestureCollector-iOS.ipa
          plutil -lint ours/mac_app/GestureCollector/Info-iOS.plist
      - name: Zip
        run: |
          cd ours/mac_app/GestureCollector
          ditto -c -k --keepParent GestureCollector.app GestureCollector.zip
      - name: Publish as release "gesture-collector"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gesture-collector --yes --cleanup-tag || true
          gh release create gesture-collector ours/mac_app/GestureCollector/GestureCollector.zip             ours/mac_app/GestureCollector/GestureCollector-iOS.ipa ours/mac_app/PILOT_GUIDE.md --target "$GITHUB_SHA"             --title "Gesture Collector v3 (Mac + iPhone data-collection app)"             --notes "Pilot build. Mac: GestureCollector.zip (macOS 14+). iPhone: GestureCollector-iOS.ipa (iOS 16+, unsigned: install with Sideloadly or Xcode using your own Apple ID). Read PILOT_GUIDE.md first. AirPods with head tracking needed (Pro, 3, 4, 5, Max). Built from $GITHUB_SHA."
